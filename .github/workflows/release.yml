name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run release:windows
      - name: prepare portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          Copy-Item "src-tauri/target/release/EDI Developer Journal.exe" "release-assets/EDI.Developer.Journal_${version}_x64-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            release-assets/*-portable.exe
          if-no-files-found: error

  linux-packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run release:linux
      - name: smoke test Linux desktop
        shell: bash
        run: |
          set +e
          timeout 15s xvfb-run -a "src-tauri/target/release/EDI Developer Journal"
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "Linux desktop process exited unexpectedly with status $status"
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  macos-portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x64
          - runner: macos-latest
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run release:macos
      - name: package portable app
        shell: bash
        run: |
          mkdir -p release-assets
          version="${GITHUB_REF_NAME#v}"
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/release/bundle/macos/EDI Developer Journal.app" \
            "release-assets/EDI.Developer.Journal_${version}_${{ matrix.architecture }}-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.architecture }}-portable
          path: release-assets/*-portable.zip
          if-no-files-found: error

  publish:
    needs:
      - windows-installer
      - linux-packages
      - macos-portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release files were downloaded"
            printf '%s\n' "${assets[@]}"
            exit 1
          fi

          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "${assets[@]}" \
              --repo "${{ github.repository }}" \
              --clobber
            gh release edit "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --draft=false \
              --latest \
              --title "EDI Developer Journal ${{ github.ref_name }}"
          else
            gh release create "${{ github.ref_name }}" "${assets[@]}" \
              --repo "${{ github.repository }}" \
              --generate-notes \
              --latest \
              --title "EDI Developer Journal ${{ github.ref_name }}"
          fi
