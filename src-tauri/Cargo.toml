[package]
name = "edi-developer-journal"
version = "0.1.1"
description = "Local-first project context and decision memory"
authors = ["EDI Developer Journal"]
edition = "2021"

[lib]
name = "edi_developer_journal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
dirs = "6"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
uuid = { version = "1", features = ["v4"] }
